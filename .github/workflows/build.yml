name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Builds src/ with the pinned @typesol/cli in its --docker container (linux/amd64) and checks the binary's sha256.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check-hash
